name: steward-table

# Self-host / local quickstart. `docker compose -f docker/docker-compose.yml up -d`
# brings up Postgres + S3-compatible storage, applies migrations, then starts
# the app.
# Add `--profile demo` to also load the demo church and a sign-in you can use:
# owner@gracefellowship.demo / demo1234.

# Environment shared by the app and the one-off migrate/seed jobs. Values here
# are safe local defaults; a `../.env.local` (git-ignored) layers on top and
# wins, and is optional.
x-app-env: &app-env
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/steward_table
  NEXTAUTH_URL: http://localhost:3001
  NEXT_PUBLIC_APP_URL: http://localhost:3001
  # Dev-only placeholder so the app boots out of the box. Generate a real one
  # (`openssl rand -base64 32`) for anything exposed to a network.
  NEXTAUTH_SECRET: dev-insecure-nextauth-secret-change-me-0000000000
  # Auth.js v5 rejects every request as UntrustedHost behind Docker's port
  # publish without this.
  AUTH_TRUST_HOST: "true"
  # The bundled storage container, as browsers reach it: presigned uploads and
  # image links are built from this, so it is the published port, not the
  # in-network name. A `../.env.local` with real R2_* values switches to R2.
  R2_ENDPOINT: http://localhost:9000
  R2_ACCESS_KEY_ID: &storage-access steward-table
  R2_SECRET_ACCESS_KEY: &storage-secret dev-insecure-storage-secret-change-me
  R2_BUCKET_NAME: &storage-bucket steward-table

x-app-envfile: &app-envfile
  - path: ../.env.local
    required: false

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: steward_table
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d steward_table"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Object storage: Versity S3 Gateway, an Apache-2.0 S3 server keeping each
  # object as a plain file under /data/<bucket>/. It replaced MinIO when MinIO
  # stopped publishing images anyone can pull (quay.io and Docker Hub both
  # answer 401). One port, the S3 API; it refuses to start without
  # credentials. Region "auto" because the app signs requests the way R2
  # expects. Pinned: a floating tag is a dependency on someone else's Tuesday.
  storage:
    image: versity/versitygw:v1.9.0
    restart: unless-stopped
    command: ["posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: *storage-access
      ROOT_SECRET_KEY: *storage-secret
      VGW_REGION: auto
      VGW_HEALTH: /health
      VGW_QUIET: "true"
    ports:
      - "9000:7070"
    volumes:
      - storage_data:/data
    depends_on:
      storage-createbucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7070/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # A bucket is a top-level directory on the gateway's volume.
  storage-createbucket:
    image: versity/versitygw:v1.9.0
    entrypoint: ["sh", "-c", "mkdir -p /data/steward-table && echo 'bucket ready: steward-table'"]
    volumes:
      - storage_data:/data
    network_mode: none
    restart: "no"

  # One-off: let browsers upload to the bucket (CORS) and show what they
  # uploaded (anonymous read of objects, not of the listing). See
  # scripts/storage-init.mjs. The app does not wait on it: without it only
  # image upload is affected.
  storage-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder
    environment:
      STORAGE_INTERNAL_ENDPOINT: http://storage:7070
      STORAGE_ACCESS_KEY: *storage-access
      STORAGE_SECRET_KEY: *storage-secret
      STORAGE_BUCKET: *storage-bucket
      NEXT_PUBLIC_APP_URL: http://localhost:3001
    command: node scripts/storage-init.mjs
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"

  # One-off: apply Prisma migrations, then exit. The runner image is a Next.js
  # standalone bundle with no Prisma CLI, so this uses the `builder` stage.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder
    env_file: *app-envfile
    environment: *app-env
    command: sh -c "node_modules/.bin/prisma migrate deploy --schema prisma/schema"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Opt-in demo data: `docker compose --profile demo up -d`. Loads the
  # "Grace Fellowship" church and owner@gracefellowship.demo / demo1234.
  # Idempotent — everything is upserted; only the sample orders/customers are
  # recreated — so it is safe to leave the profile on.
  seed:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder
    env_file: *app-envfile
    environment: *app-env
    command: sh -c "pnpm db:seed"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: *app-envfile
    environment: *app-env
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  storage_data:
